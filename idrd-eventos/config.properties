# ===== Configuracion del programa de eventos IDRD =====

# Archivo Excel con los eventos (ruta relativa a la carpeta del proyecto)
excel.ruta=data/Eventos_IDRD.xlsx

# Archivo donde se guardan los correos registrados
suscripciones.ruta=data/suscripciones.csv

# Anio que se usa si el Excel no tiene la columna "Anio"
anio.por.defecto=2026

# Cada cuantos minutos revisa el programa si hay que enviar avisos
notificador.intervalo.minutos=30

# ===== Envio de correos (SMTP) =====
# Si "smtp.usuario" queda vacio el programa funciona en MODO SIMULACION:
# no envia correos reales, solo muestra en pantalla lo que enviaria.
#
# Ejemplo con Gmail:
#   1. Activa la verificacion en 2 pasos en tu cuenta Google.
#   2. Crea una "Contrasena de aplicacion" (myaccount.google.com/apppasswords).
#   3. Pegala en smtp.clave (sin espacios).
smtp.host=smtp.gmail.com
smtp.puerto=587
smtp.usuario=
smtp.clave=
smtp.remitente=
